include:
  - path: project-base.yml

name: PocketDemo

targets:
  PocketDemo:
    platform: iOS
    type: application
    sources:
      - path: PocketDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.MKM.PocketDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: [DEBUG]
    info:
      path: PocketDemo/Info.plist
      properties:
        # The backend runs on http://127.0.0.1:8787 during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - target: SwiftLint
        type: aggregate
      # Local Packages
      - package: PocketNetworking
      - package: PocketSync
      - package: PocketRecordings
      - package: Domain
      - package: PocketUI
      # External SPM Packages
      - package: swift-dependencies
        product: Dependencies
