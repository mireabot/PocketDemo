included:
  - Layers
  - PocketDemo

excluded:
  - Layers/*/*/.build

disabled_rules:
  - blanket_disable_command
  - closure_parameter_position
  - cyclomatic_complexity
  - file_length
  - force_try
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - multiple_closures_with_trailing_closure
  - nesting
  - opening_brace
  - redundant_sendable
  - todo
  - trailing_comma
  - trailing_whitespace
  - type_body_length
  - type_name

analyzer_rules:
  - unused_import

unused_import:
  always_keep_imports:
    - Foundation
    - SwiftUI
